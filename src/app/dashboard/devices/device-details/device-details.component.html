@if (device(); as d) {
  <div class="flex flex-col gap-6 m-2.5">
    <div class="flex items-start justify-between">
      <div>
        <a class="text-sm text-slate-500 hover:text-slate-200 " routerLink="/app/devices">
          ← Back to devices
        </a>
        <h1 class="text-3xl font-semibold mt-1">{{ d.name }}</h1>
        <div class="mt-2 flex flex-wrap items-center gap-2">
          <app-status-pill
            [text]="d.onlineStatus"
            [tone]="d.onlineStatus === 'ONLINE' ? SomeEnum.GOOD : SomeEnum.BAD">
          </app-status-pill>
          <span class="text-sm text-slate-600">Last seen: {{ d.lastSeen | date:'short' }}</span>
          <span class="text-slate-300">•</span>
          <span class="text-sm text-slate-600">{{ d.model }}</span>
        </div>
      </div>
      <button mat-stroked-button class="rounded-xl!" (click)="refresh()">
        <mat-icon>refresh</mat-icon>
        Refresh
      </button>
    </div>
    <!-- Tiles -->
    <div class="grid lg:grid-cols-3 gap-4">
      <app-battery-tile [device]="d" />
<!--      <app-performance-tile [device]="d" />-->
<!--      <app-storage-tile [device]="d" />-->
<!--      <app-network-tile [device]="d" />-->
<!--      <app-security-tile [device]="d" />-->
<!--      <app-hardware-tile [device]="d" />-->
    </div>
  </div>
} @else {
  <mat-card class="!rounded-3xl !border !border-slate-200 !shadow-none p-6">
    <div class="font-semibold">Device not found</div>
    <a class="text-brand-700 hover:underline" routerLink="/app/devices">Go back</a>
  </mat-card>
}
