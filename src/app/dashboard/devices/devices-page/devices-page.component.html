<div class="flex flex-col gap-2.5">

  <!-- Page header -->
  <div class="flex flex-col md:flex-row md:items-end gap-3 m-3.5">
    <input
      hlmInput
      class="w-full md:w-64"
      placeholder="Search by name, owner, tag…"
      (input)="query.set(($any($event.target).value || '').trim())"
    />
  </div>

  <!-- Fleet table — flat, transparent, spartan-ng style -->
  <div class="rounded-lg border border-border overflow-hidden m-3.5">

    <!-- Table toolbar -->
    <div class="flex items-center justify-between px-4 py-3 border-b border-border bg-muted/30">
      <span class="text-sm font-medium text-foreground">Fleet</span>
      <span class="text-xs text-muted-foreground">{{ filtered().length }} devices</span>
    </div>

    <div class="overflow-auto">
      <table class="min-w-100 w-full text-sm">
        <thead>
          <tr class="border-b border-border">
            <th class="px-4 py-2.5 text-left text-xs font-medium text-muted-foreground">Device</th>
            <th class="px-4 py-2.5 text-left text-xs font-medium text-muted-foreground">Status</th>
<!--            <th class="px-4 py-2.5 text-left text-xs font-medium text-muted-foreground">Performance</th>-->
<!--            <th class="px-4 py-2.5 text-left text-xs font-medium text-muted-foreground">Disk</th>-->
<!--            <th class="px-4 py-2.5 text-left text-xs font-medium text-muted-foreground">Security</th>-->
          </tr>
        </thead>
        <tbody>
          @for (d of filtered(); track d.id) {
            <tr class="border-b border-border last:border-0 hover:bg-muted/20 transition-colors">
              <td class="px-4 py-3">
                <a class="font-medium text-foreground hover:underline underline-offset-4" [routerLink]="['/devices', d.id]">
                  {{ d.name }}
                </a>
                <div class="text-xs text-muted-foreground mt-0.5">{{ d.model }}</div>
              </td>
              <td class="px-4 py-3">
                <app-status-pill
                  [text]="d.onlineStatus"
                  [tone]="d.onlineStatus === 'ONLINE' ? SomeEnum.GOOD : SomeEnum.BAD">
                </app-status-pill>
                <div class="text-xs text-muted-foreground mt-1">Last seen: {{ d.lastSeen | date:'short' }}</div>
              </td>
<!--              <td class="px-4 py-3 text-muted-foreground">-->
<!--                CPU avg: <span class="font-medium text-foreground">{{ pct(d.cpuAvgPct) }}</span>-->
<!--                <span class="mx-1">·</span>-->
<!--                spike: <span class="font-medium text-foreground">{{ pct(d.cpuSpikePct) }}</span><br />-->
<!--                RAM: <span class="font-medium text-foreground">{{ pct(d.ramUsedPct) }}</span>-->
<!--              </td>-->
<!--              <td class="px-4 py-3 text-muted-foreground">-->
<!--                Used: <span class="font-medium text-foreground">{{ pct(d.diskUsedPct) }}</span><br />-->
<!--                SMART: <span class="font-medium text-foreground">{{ d.smartStatus ?? '—' }}</span>-->
<!--              </td>-->
<!--              <td class="px-4 py-3 text-muted-foreground">-->
<!--                Up-to-date: <span class="font-medium text-foreground">{{ d.upToDate === true ? 'Yes' : d.upToDate === false ? 'No' : '—' }}</span><br />-->
<!--                Updates: <span class="font-medium text-foreground">{{ d.pendingSecurityUpdates ?? '—' }}</span>-->
<!--              </td>-->
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>

</div>
