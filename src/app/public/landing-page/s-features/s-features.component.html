<section class="mx-auto w-full max-w-6xl px-4 pb-14">
    <h2 class="text-3xl font-semibold">Features</h2>
    <div class="mt-6 grid md:grid-cols-2 lg:grid-cols-3 gap-4">
        @for (f of features; track f) {
            <div class="rounded-3xl border border-white/10 bg-white/5 p-6">
                <div class="flex items-center gap-2 text-cyan-200 font-semibold">
                    <mat-icon>{{ f.icon }}</mat-icon> {{ f.title }}
                </div>
                <p class="mt-2 text-slate-300">{{ f.desc }}</p>
            </div>
        }
    </div>
</section>
