<mat-toolbar class="!bg-transparent !text-slate-100">
    <div class="mx-auto w-full max-w-6xl flex items-center justify-between px-2">
        <div class="flex items-center gap-3">
            <div class="leading-tight">
                <img ngSrc="softronic_logo_new.png" alt="Softronic device health & status monitoring dashboard" height="50" width="155">
                <div class="text-[9px] text-sky-400! text-center">Device Health & Status Dashboard</div>
            </div>
        </div>


        <div class="hidden md:flex items-center gap-2">
            <button mat-stroked-button class="!rounded-full !border-cyan-400/40 !text-cyan-100"
                    (click)="goLogin()">
                Log in
            </button>
            <button mat-flat-button class="!rounded-full !bg-cyan-500 !text-slate-900"
                    (click)="goRegister()">
                Get started free
            </button>
            
            <button hlmBtn class="rounded-2xl bg-cyan-500 text-slate-900 hover:bg-cyan-500 hover:text-slate-900 "
                (click) = "joinWaitingList()">
                <p class="!text-xs">Join waiting List</p>
            </button>
            <button hlmBtn variant="secondary" class="rounded-lg border-2 border-cyan-500 text-slate-300 bg-black hover:bg-cyan-500 hover:text-black"
                (click) = "getInvolved()">
                <p class="!text-xs">Get involved</p>
            </button>
        </div>
    </div>
</mat-toolbar>
