<section class="mx-auto w-full max-w-6xl px-4 pb-14">
    <div class="rounded-3xl border border-cyan-400/20 bg-gradient-to-b from-white/5 to-transparent p-8">
        <h2 class="text-3xl font-semibold">Pricing for launching phase</h2>
        <p class="mt-2 text-slate-300">No billing yet—just early access and testing our services for free</p>

        <div class="mt-6 grid md:grid-cols-2 gap-4">
            <div class="rounded-3xl border border-white/10 bg-white/5 p-6">
                <div class="font-semibold">Free</div>
                <div class="text-slate-300 mt-1">Up to 5 devices</div>
            </div>
            <div class="rounded-3xl border border-cyan-400/20 bg-cyan-500/10 p-6">
                <div class="font-semibold">Pro</div>
                <div class="text-slate-300 mt-1">More devices & full history (coming soon)</div>
            </div>
        </div>

        <div class="mt-6">
            <button mat-flat-button class="!rounded-full !bg-cyan-500 !text-slate-900 !px-7 !py-6" (click)="doSubscribe()">
                Get early access
            </button>
        </div>
    </div>
</section>
