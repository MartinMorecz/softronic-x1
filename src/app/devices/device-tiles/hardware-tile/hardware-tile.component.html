<mat-card class="!rounded-3xl !border !border-slate-200 !shadow-none">
  <div class="p-5 flex items-center justify-between border-b border-slate-200">
    <div class="font-semibold flex items-center gap-2">
      <mat-icon>devices</mat-icon>
      Hardware & Age
    </div>
    <div class="text-xs text-slate-500">Replace weakest first</div>
  </div>

  <div class="p-5 grid grid-cols-2 gap-3">
    <app-metric label="Model" [value]="device.model" />
    <app-metric label="CPU" [value]="device.cpu" />
    <app-metric label="RAM" [value]="device.ramGb + ' GB'" />
    <app-metric label="Disk type" [value]="device.diskType" />
    <app-metric label="Device age" [value]="age(device.purchaseDate)" />
    <app-metric label="Warranty" [value]="warranty()" />
  </div>
</mat-card>
