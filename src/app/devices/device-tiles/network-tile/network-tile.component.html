<mat-card class="!rounded-3xl !border !border-slate-200 !shadow-none">
  <div class="p-5 flex items-center justify-between border-b border-slate-200">
    <div class="font-semibold flex items-center gap-2">
      <mat-icon>wifi</mat-icon>
      Network & Connectivity
    </div>
    <app-status-pill
      [text]="device().onlineStatus"
      [tone]="device().onlineStatus === 'ONLINE' ? SomeEnum.GOOD : SomeEnum.BAD">
    </app-status-pill>
  </div>

  <div class="p-5 grid grid-cols-2 gap-3">
    <app-metric label="Latency" [value]="ms(device().avgLatencyMs)" hint="Avg ping to endpoint" />
    <app-metric label="Packet loss" [value]="pct(device().packetLossPct)" hint="Basic disconnect signal" />
    <div class="col-span-2">
      <app-metric label="Last seen" [value]="(device().lastSeen | date:'short') ?? '—'" />
    </div>
  </div>
</mat-card>
