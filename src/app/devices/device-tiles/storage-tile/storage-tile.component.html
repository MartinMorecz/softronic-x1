<mat-card class="!rounded-3xl !border !border-slate-200 !shadow-none">
  <div class="p-5 flex items-center justify-between border-b border-slate-200">
    <div class="font-semibold flex items-center gap-2">
      <mat-icon>storage</mat-icon>
      Storage & Disk Health
    </div>
    <div class="text-xs text-slate-500">Avoid disk-full crashes</div>
  </div>

  <div class="p-5 grid grid-cols-2 gap-3">
    <app-metric label="Disk used" [value]="pct(device().diskUsedPct)" />
    <app-metric label="SMART" [value]="device().smartStatus ?? '—'" />
    <app-metric label="Free space" [value]="gb(device().freeDiskGb)" />
    <app-metric label="Total disk" [value]="gb(device().totalDiskGb)" />
    <div class="col-span-2" *ngIf="device().fragmentationPct !== undefined">
      <app-metric label="Fragmentation" [value]="pct(device().fragmentationPct)" />
    </div>
  </div>

  <mat-divider *ngIf="(device().topConsumers?.length ?? 0) > 0"></mat-divider>

  <div class="p-5" *ngIf="(device().topConsumers?.length ?? 0) > 0">
    <div class="text-sm font-semibold">Biggest folders/apps</div>
    <div class="mt-3 space-y-2">
      <div class="flex items-center justify-between text-sm" *ngFor="let t of device().topConsumers">
        <div class="text-slate-700">{{ t.name }}</div>
        <div class="text-slate-500">{{ t.sizeGb }} GB</div>
      </div>
    </div>
  </div>
</mat-card>
