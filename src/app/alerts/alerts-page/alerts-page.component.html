<div class="flex flex-col gap-4">
  <div>
    <h1 class="text-3xl font-semibold">Events & Alerts</h1>
    <p class="text-slate-600 mt-1">Across all devices: overheating, low disk, high CPU, low battery health, offline too long.</p>
  </div>

  <div class="grid gap-3">
    @for (a of alerts(); track a) {
      <mat-card class="!rounded-3xl !border !border-slate-200 !shadow-none">
        <div class="p-5 flex flex-col md:flex-row md:items-center md:justify-between gap-3">
          <div class="flex items-start gap-3">
            <mat-icon class="mt-0.5">{{ icon(a) }}</mat-icon>
            <div>
              <div class="flex flex-wrap items-center gap-2">
                <app-status-pill [text]="a.severity" [tone]="tone(a)"></app-status-pill>
                <a class="font-semibold text-brand-700 hover:underline" [routerLink]="['/app/devices', a.deviceId]">
                  {{ a.deviceName }}
                </a>
                <span class="text-sm text-slate-500">{{ a.occurredAt | date:'short' }}</span>
                @if (a.acknowledged) {
                  <span class="text-xs text-slate-500">(acknowledged)</span>
                }
              </div>
              <div class="mt-1 text-slate-700">{{ a.message }}</div>
              <div class="mt-1 text-xs text-slate-500">{{ a.type }}</div>
            </div>
          </div>
          <button mat-stroked-button class="!rounded-xl"
            [disabled]="a.acknowledged"
            (click)="ack(a)">
            <mat-icon>done</mat-icon>
            Acknowledge
          </button>
        </div>
      </mat-card>
    }
  </div>
</div>
