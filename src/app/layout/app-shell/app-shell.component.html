<mat-sidenav-container class="h-screen bg-slate-950 text-slate-100">
  <mat-sidenav mode="side" opened class="w-10 !bg-slate-950 border-r border-white/10">
    <div class="p-5 border-b border-white/10">
      <div class="flex items-center gap-3">
        <div class="h-10 w-10 rounded-2xl bg-cyan-500/20 border border-cyan-400/30 flex items-center justify-center font-bold">S</div>
        <div>
          <div class="font-semibold text-sky-700">Softronic</div>
          <div class="text-xs text-slate-500">DashboardX</div>
        </div>
      </div>
    </div>

    <mat-nav-list id="nav-list">
      <div>
        <a id ="dashboard" mat-list-item routerLink="/devices" routerLinkActive="active-link" class="!text-sky-50">
          <mat-icon matListItemIcon>dashboard</mat-icon>
          <span matListItemTitle class="!text-slate-100">Dashboard</span>
        </a>
        <a id ="alerts" mat-list-item routerLink="/alerts" routerLinkActive="active-link" class="!text-sky-50">
          <mat-icon matListItemIcon>notifications_active</mat-icon>
          <span matListItemTitle class="!text-slate-100">Alerts</span>
        </a>
        <a id = "settings" mat-list-item routerLink="/settings" routerLinkActive="active-link" class="!text-sky-50">
          <mat-icon matListItemIcon>settings</mat-icon>
          <span matListItemTitle class="!text-slate-100">Settings</span>
        </a>
      </div>
    </mat-nav-list>

  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="!bg-slate-950 !text-slate-100 border-b border-white/10">
      <div class="mx-auto w-full max-w-6xl flex items-center justify-between">
        <div class="font-semibold">Monitoring</div>
        <button  id="logoutBtn" mat-stroked-button class="!rounded-full !border-white/20 !text-slate-100 hover:text-green-100" (click)="logout()">
          Log out
        </button>
      </div>
    </mat-toolbar>

    <main class="mx-auto w-full max-w-6xl p-4 md:p-6">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
